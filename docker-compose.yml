version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliate-postgres
    environment:
      POSTGRES_USER: affiliate_user
      POSTGRES_PASSWORD: affiliate_pass
      POSTGRES_DB: affiliate_dev
    # Host port is deliberately not 5432. Developers here run several projects
    # at once and the default is usually already bound by another stack. The
    # container port is unchanged, so DATABASE_URL is the only thing that has
    # to know about this.
    ports:
      - '5452:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U affiliate_user -d affiliate_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: affiliate-redis
    ports:
      - '6389:6379'
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
