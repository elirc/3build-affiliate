name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the previous run. Without this, a branch
# with five quick pushes queues five full runs and the useful one waits behind
# four obsolete ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: affiliate_user
          POSTGRES_PASSWORD: affiliate_pass
          POSTGRES_DB: affiliate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U affiliate_user -d affiliate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI talks to the service containers on their default ports. Local dev
      # uses non-default ports to avoid colliding with other projects; that
      # difference lives entirely in .env, which is why it is not committed.
      DATABASE_URL: postgresql://affiliate_user:affiliate_pass@localhost:5432/affiliate_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-value-long-enough
      JWT_REFRESH_SECRET: ci-refresh-secret-value-long-enough
      IP_SALT: ci-ip-salt
      # Both of these are validated for length/shape at boot, so CI needs
      # values that actually satisfy the schema rather than placeholders.
      INTERNAL_API_TOKEN: ci-internal-token-long-enough-for-the-schema
      POSTBACK_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync with package.json. `npm install` would quietly
      # resolve a different tree, which is how "works on my machine" starts.
      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Apply migrations
        run: npm run db:deploy --workspace=apps/api

      # The integration suite truncates every table between tests, so it gets
      # its own database rather than sharing with anything else in the job.
      - name: Create the integration test database
        run: |
          PGPASSWORD=affiliate_pass createdb \
            -h localhost -U affiliate_user affiliate_integration

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Runs against the service containers above, in its own database so a
      # truncating test suite can never touch anything else.
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://affiliate_user:affiliate_pass@localhost:5432/affiliate_integration

      - name: Build
        run: npm run build
